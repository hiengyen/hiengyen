name: Metrics
on:
  # Schedule updates daily at midnight UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allow manual trigger via GitHub Actions UI
  workflow_dispatch:
  # Run on push to master/main branches
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Generate General Profile Metrics (repos, stars, header, languages)
      - name: General Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      # Step 2: Generate Detailed Commit Calendar (Full)
      - name: Full Commit Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.calendar.full.svg
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 2 # Displays the last 2 years
          config_timezone: Asia/Ho_Chi_Minh
